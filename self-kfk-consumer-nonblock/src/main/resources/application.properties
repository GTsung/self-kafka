spring.application.name=self-kfk-consumer-nonblock
server.port=8015

# kafka
spring.kafka.bootstrap-servers=localhost:9192,localhost:9292,localhost:9392
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.group-id=consumer-nonblock-group-demo
kafka.nonblock.topic=topic-nonblock-demo

# mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/test_kafka?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
# 最大连接数（含空闲与使用中）
spring.datasource.hikari.maximum-pool-size=20
# 最小空闲连接数（建议与 maximum-pool-size 一致以减少抖动）[citation:7]
spring.datasource.hikari.minimum-idle=10
# 连接最大存活时间（ms），建议小于数据库 wait_timeout [citation:3][citation:7]
spring.datasource.hikari.max-lifetime=1800000
# 空闲连接超时时间（ms）
spring.datasource.hikari.idle-timeout=600000
# 获取连接超时时间（ms），建议短于业务超时以快速失败 [citation:3][citation:7]
spring.datasource.hikari.connection-timeout=30000
# --- 连接校验与泄漏检测 ---
# 连接有效性检测 SQL（部分驱动支持 isValid 则无需配置）
spring.datasource.hikari.connection-test-query=SELECT 1
# 校验超时时间（ms）
spring.datasource.hikari.validation-timeout=5000
# 连接泄漏检测阈值（ms），生产环境建议开启 [citation:3]
spring.datasource.hikari.leak-detection-threshold=60000
# 是否自动提交
spring.datasource.hikari.auto-commit=true
# 连接池名称，便于监控识别
spring.datasource.hikari.pool-name=MyHikariPool
# 开启 JMX 监控 [citation:12]
# spring.datasource.hikari.register-mbeans= true
# 默认 catalog
# spring.datasource.hikari.catalog= your_catalog
# 默认 schema（部分数据库支持）
# spring.datasource.hikari.schema= your_schema
# 事务隔离级别
# spring.datasource.hikari.transaction-isolation= TRANSACTION_READ_COMMITTED

# mybatis
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=false
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.type-aliases-package=com.self.kafka.consumer.nonblock.mapper
