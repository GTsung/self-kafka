spring.application.name=self-kafka-consumer

server.port=8013

spring.kafka.bootstrap-servers=localhost:9192,localhost:9292,localhost:9392
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.group-id=consumer-group-demo

# ackMode -> MANUAL_IMMEDIATE ,  MANUAL -> 支持手动提交
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
#spring.kafka.listener.ack-mode=MANUAL


kafka.topic=topic-demo

