spring.application.name=self-kfk-consumer-nonblock
server.port=8015

# kafka
spring.kafka.bootstrap-servers=localhost:9192,localhost:9292,localhost:9392
spring.kafka.producer.acks=all

spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.group-id=consumer-group-demo
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

kafka.business.topic=topic-demo
kafka.ttlDeadline.topic=topic-demo-dlt

